version: "3.9"

services:
  device-service:
    build: ./services/device-service
    ports:
      - "8001:8001"

  job-service:
    build: ./services/job-service
    ports:
      - "8002:8002"

  scheduler-service:
    build: ./services/scheduler-service
    depends_on:
      - device-service
      - job-service
    ports:
      - "8003:8003"
